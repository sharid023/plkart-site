<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" role="img" aria-label="Hand-knotted Pyarelal rug">
  <defs>
    <!-- repeating field lattice -->
    <pattern id="plfield" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#9e4326"/>
      <path d="M20 5 L35 20 L20 35 L5 20 Z" fill="none" stroke="#dc9a5c" stroke-width="1.3"/>
      <path d="M20 12 L28 20 L20 28 L12 20 Z" fill="#2f3a39" opacity="0.5"/>
      <circle cx="20" cy="20" r="2" fill="#ecd8ac"/>
    </pattern>
    <!-- repeating border band -->
    <pattern id="plborder" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#efe3c6"/>
      <path d="M15 3 L27 15 L15 27 L3 15 Z" fill="none" stroke="#9e4326" stroke-width="1.6"/>
      <path d="M15 9 L21 15 L15 21 L9 15 Z" fill="#c69a4c"/>
    </pattern>
    <linearGradient id="plsheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a130a" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <rect width="500" height="620" fill="#efe9db"/>

  <!-- fringe (top & bottom) -->
  <line x1="42" y1="18" x2="458" y2="18" stroke="#cdbb95" stroke-width="16" stroke-dasharray="2 10"/>
  <line x1="42" y1="602" x2="458" y2="602" stroke="#cdbb95" stroke-width="16" stroke-dasharray="2 10"/>

  <!-- nested borders -->
  <rect x="36" y="28" width="428" height="564" fill="#2f3a39"/>
  <rect x="44" y="36" width="412" height="548" fill="#c69a4c"/>
  <rect x="48" y="40" width="404" height="540" fill="url(#plborder)"/>
  <rect x="76" y="68" width="348" height="484" fill="#c69a4c"/>
  <rect x="80" y="72" width="340" height="476" fill="#2f3a39"/>
  <rect x="84" y="76" width="332" height="468" fill="url(#plfield)"/>

  <!-- corner spandrels -->
  <g>
    <g transform="translate(120 112)"><path d="M0 -26 L26 0 L0 26 L-26 0 Z" fill="#efe3c6"/><path d="M0 -15 L15 0 L0 15 L-15 0 Z" fill="#2f3a39"/><circle r="4" fill="#c69a4c"/></g>
    <g transform="translate(380 112)"><path d="M0 -26 L26 0 L0 26 L-26 0 Z" fill="#efe3c6"/><path d="M0 -15 L15 0 L0 15 L-15 0 Z" fill="#2f3a39"/><circle r="4" fill="#c69a4c"/></g>
    <g transform="translate(120 508)"><path d="M0 -26 L26 0 L0 26 L-26 0 Z" fill="#efe3c6"/><path d="M0 -15 L15 0 L0 15 L-15 0 Z" fill="#2f3a39"/><circle r="4" fill="#c69a4c"/></g>
    <g transform="translate(380 508)"><path d="M0 -26 L26 0 L0 26 L-26 0 Z" fill="#efe3c6"/><path d="M0 -15 L15 0 L0 15 L-15 0 Z" fill="#2f3a39"/><circle r="4" fill="#c69a4c"/></g>
  </g>

  <!-- small axis motifs -->
  <g fill="#efe3c6">
    <path d="M250 140 L266 162 L250 184 L234 162 Z"/>
    <path d="M250 436 L266 458 L250 480 L234 458 Z"/>
  </g>
  <g fill="#2f3a39">
    <path d="M250 150 L260 162 L250 174 L240 162 Z"/>
    <path d="M250 446 L260 458 L250 470 L240 458 Z"/>
  </g>

  <!-- central medallion -->
  <g transform="translate(250 310)">
    <path d="M0 -150 L120 0 L0 150 L-120 0 Z" fill="#2f3a39"/>
    <path d="M0 -132 L104 0 L0 132 L-104 0 Z" fill="#efe3c6"/>
    <path d="M0 -118 L92 0 L0 118 L-92 0 Z" fill="none" stroke="#9e4326" stroke-width="3" stroke-dasharray="6 6"/>
    <path d="M0 -106 L82 0 L0 106 L-82 0 Z" fill="#9e4326"/>
    <!-- 8-point gold star -->
    <path d="M0 -62 L62 0 L0 62 L-62 0 Z" fill="#c69a4c"/>
    <rect x="-43" y="-43" width="86" height="86" fill="#c69a4c"/>
    <path d="M0 -46 L46 0 L0 46 L-46 0 Z" fill="#2f3a39"/>
    <rect x="-32" y="-32" width="64" height="64" fill="#2f3a39"/>
    <!-- floral tips -->
    <g fill="#c69a4c">
      <circle cx="0" cy="-86" r="7"/><circle cx="0" cy="86" r="7"/>
      <circle cx="-68" cy="0" r="7"/><circle cx="68" cy="0" r="7"/>
    </g>
    <!-- center -->
    <circle r="22" fill="#efe3c6"/>
    <path d="M0 -16 L16 0 L0 16 L-16 0 Z" fill="#9e4326"/>
    <circle r="6" fill="#c69a4c"/>
  </g>

  <!-- soft sheen for depth -->
  <rect x="36" y="28" width="428" height="564" fill="url(#plsheen)"/>
</svg>
